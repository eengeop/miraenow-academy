<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>샘플 안내장 | MiraeNow Academy</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar__inner">
        <div>
          <p class="eyebrow">MiraeNow Academy · Prototype</p>
          <h1>샘플 안내장</h1>
        </div>
        <div class="toolbar__actions">
          <a class="download" href="/sample-notice.svg" download>SVG 저장</a>
          <button id="zoom" type="button" aria-pressed="false">확대 보기</button>
        </div>
      </div>
    </header>
    <main>
      <p class="notice">실제 학생 정보가 없는 화면 검증용 샘플입니다.</p>
      <div class="image-viewport" id="image-viewport">
        <img
          class="notice-image"
          src="/sample-notice.svg"
          alt="샘플 안내장. 제목과 여러 개의 예시 구역이 세로로 이어진 긴 이미지"
          width="720"
          height="3000"
        />
      </div>
      <p class="help">화면을 위아래로 스크롤해 읽으세요. 확대하면 좌우로 움직여 볼 수 있습니다.</p>
    </main>
  </body>
</html>
